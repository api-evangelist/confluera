name: Confluera
description: Confluera was a cybersecurity company founded in 2018 in Palo Alto, California, backed by
  Lightspeed Venture Partners, that built a Cloud eXtended Detection and Response (CxDR) platform for
  autonomous, real-time detection and response across cloud and on-premises infrastructure. Its technology
  correlated low-level security signals into progressing cyberattack storylines. Confluera was acquired by
  Zscaler (announced December 2022, closed early 2023); the standalone confluera.com domain has since been
  retired and no independent developer portal, API, or documentation surface remains publicly reachable.
